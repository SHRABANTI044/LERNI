services:
  # Full-Stack Web Service (Runs both React frontend and Express backend on one URL)
  - type: web
    name: lerni-app
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lerni-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: lerni-db
    databaseName: lerni
    user: lerni_user
    plan: free

